name: P20 Platform Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Django Backend & PostgreSQL Exclusion Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: p20_campus_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-django-test-secret-key-do-not-use-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: p20_campus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable PostgreSQL btree_gist Extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d p20_campus_db -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Verify No Missing Migrations
        run: |
          python backend/manage.py makemigrations --check

      - name: Execute Database Migrations
        run: |
          python backend/manage.py migrate

      - name: Execute Full 5-App Django Test Suite
        run: |
          python backend/manage.py test --noinput accounts resources bookings availability config

  frontend-pipeline:
    name: Next.js Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Clean Install NPM Dependencies (npm ci)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Frontend Tests
        run: npm test --if-present

      - name: Run Next.js Production Build
        run: npm run build
