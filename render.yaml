databases:
  - name: p20-postgres
    databaseName: p20_campus_db
    user: postgres
    plan: free

services:
  # Django REST Backend Web Service
  - type: web
    name: p20-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r ../requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo_users && python manage.py seed_resources"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: p20-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
