databases:
  - name: p20-postgres
    databaseName: p20_campus_db
    user: postgres
    plan: free

services:
  # Django REST Backend Web Service (Docker Container)
  - type: web
    name: p20-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: p20-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
